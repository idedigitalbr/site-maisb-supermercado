<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footer Minimalista - Grupo Mais Barato</title>
  <!-- Fonte Google DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #060607;
      color: #ffffff;
    }

    /* Container de largura máxima */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ==========================================================================
       RODAPÉ MINIMALISTA CENTRALIZADO (COM EFEITO GLOW DOURADO AMBIENTAL)
       ========================================================================== */
    .footer-minimal-glow-section {
      background: #060607;
      padding: 60px 0 24px 0;
      position: relative;
      overflow: hidden;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Ponto de luz ambiental suave e difuso na parte inferior */
    .footer-minimal-glow-section::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 750px;
      height: 300px;
      background: radial-gradient(
        ellipse 60% 50% at 50% 70%,
        rgba(212, 160, 23, 0.28) 0%,
        rgba(180, 130, 20, 0.14) 40%,
        rgba(120, 80, 10, 0.04) 65%,
        transparent 85%
      );
      filter: blur(38px);
      pointer-events: none;
      z-index: 1;
    }

    .footer-minimal-container {
      position: relative;
      z-index: 2;
    }

    /* Conteúdo Central: Logo + Slogan + Ícones Sociais */
    .footer-minimal-centered-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
      margin-bottom: 45px;
    }

    .footer-logo-glow-wrapper {
      position: relative;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer-minimal-logo {
      max-width: 120px;
      height: auto;
      position: relative;
      z-index: 2;
    }

    .footer-minimal-slogan {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 26px;
      letter-spacing: 0.02em;
    }

    /* Botões Circulares de Redes Sociais */
    .footer-minimal-social-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .social-circle-minimal {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.85);
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.02);
      text-decoration: none;
    }

    .social-circle-minimal:hover {
      border-color: #c59b27;
      color: #c59b27;
      transform: translateY(-2px);
      box-shadow: 0 0 14px rgba(197, 155, 39, 0.35);
    }

    /* Barra Inferior de Direitos e Créditos */
    .footer-minimal-bottom-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.45);
      font-family: 'DM Sans', sans-serif;
      position: relative;
      z-index: 2;
    }

    /* Detalhe Dourado no Centro da Linha */
    .footer-minimal-bottom-bar::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, #ffe082 50%, transparent 100%);
      box-shadow: 0 0 5px rgba(255, 210, 80, 0.9);
      pointer-events: none;
      z-index: 3;
    }

    .footer-minimal-bottom-bar .copyright-left {
      justify-self: start;
    }

    .footer-minimal-bottom-bar .legal-center {
      justify-self: center;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    .footer-minimal-bottom-bar .legal-center:hover {
      color: #FFFFFF;
    }

    .footer-minimal-bottom-bar .dev-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .idedigital-logo-img {
      height: 16px;
      width: auto;
      opacity: 0.85;
      transition: opacity 0.2s ease, transform 0.2s ease;
      vertical-align: middle;
      display: block;
    }

    .dev-right a:hover .idedigital-logo-img {
      opacity: 1;
      transform: scale(1.05);
    }

    /* Responsividade para Telas Menores / Mobile */
    @media (max-width: 991px) {
      .footer-minimal-bottom-bar {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 12px;
        text-align: center;
      }
      .footer-minimal-bottom-bar .copyright-left,
      .footer-minimal-bottom-bar .legal-center,
      .footer-minimal-bottom-bar .dev-right {
        justify-self: center;
      }
    }
  </style>
</head>
<body>

  <!-- ===== ESTRUTURA DO FOOTER ===== -->
  <footer class="footer-minimal-glow-section">
    <div class="container footer-minimal-container">
      
      <!-- Bloco Central: Logo + Slogan + Redes Sociais -->
      <div class="footer-minimal-centered-content">
        <div class="footer-logo-glow-wrapper">
          <img src="./assets/Logo Marca Grupo MaisB/Logo Grupo Mais Barato (White Monoegativo).webp" alt="Grupo Mais Barato" class="footer-minimal-logo">
        </div>
        <p class="footer-minimal-slogan">Excelência que conecta negócios e pessoas.</p>
        <div class="footer-minimal-social-row">
          <a href="https://www.instagram.com/maisbsupermercados" target="_blank" rel="noopener" aria-label="Instagram" class="social-circle-minimal">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </a>
          <a href="https://www.facebook.com" target="_blank" rel="noopener" aria-label="Facebook" class="social-circle-minimal">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
            </svg>
          </a>
          <a href="https://www.linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn" class="social-circle-minimal">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
              <rect x="2" y="9" width="4" height="12"></rect>
              <circle cx="4" cy="4" r="2"></circle>
            </svg>
          </a>
        </div>
      </div>

      <!-- Barra Inferior de Direitos / Links -->
      <div class="footer-minimal-bottom-bar">
        <span class="copyright-left">Copyright © 2026 Grupo Mais Barato – All rights reserved</span>
        <a href="#" class="legal-center">Termos & Privacidade</a>
        <div class="dev-right">
          <span>Desenvolvido por:</span>
          <a href="https://idedigital.com.br" target="_blank" rel="noopener" aria-label="ide digital">
            <img src="./assets/01-logoh-pb-white-mono-ide-digital-negativo-png.png" alt="ide digital" class="idedigital-logo-img">
          </a>
        </div>
      </div>

    </div>
  </footer>

</body>
</html>
