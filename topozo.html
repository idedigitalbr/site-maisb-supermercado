<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supermercados +B — Topo Hero</title>
  <meta name="description" content="Supermercados Mais B — Qualidade, economia e variedade em Belém do Pará." />

  <!-- Google Fonts do Projeto Oficial -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&display=swap" rel="stylesheet" />

  <!-- Swiper.js CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    /* =====================================================
       TOKENS OFICIAIS MAIS B
       ===================================================== */
    :root {
      --yellow: #FFC400;
      --red: #F20D18;
      --black: #000000;
      --graphite: #111111;
      --dark-nav: #0d0d0d;
      --paper: #ffffff;
      --muted: #9a9a9a;
      --border: rgba(255,255,255,0.1);
      --radius: 16px;
      --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--black);
      overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }

    /* =====================================================
       TOPBAR: REDES SOCIAIS + LINKS INSTITUCIONAIS
       ===================================================== */
    .topbar {
      background: var(--black);
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Social Icons (centro no design — mas deixamos à esquerda para fidelidade) */
    .topbar-social {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-social a {
      color: var(--paper);
      opacity: 0.7;
      transition: var(--transition);
      display: flex;
      align-items: center;
    }

    .topbar-social a:hover { opacity: 1; color: var(--yellow); }

    /* Bloco central de ícones sociais (replica o design do PSD que mostra ao centro) */
    .topbar-center-social {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .topbar-center-social a {
      color: var(--paper);
      opacity: 0.75;
      transition: var(--transition);
      display: flex;
      align-items: center;
    }

    .topbar-center-social a:hover { opacity: 1; color: var(--yellow); }

    .topbar-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .topbar-links a {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--paper);
      opacity: 0.78;
      transition: var(--transition);
    }

    .topbar-links a:hover { opacity: 1; color: var(--yellow); }

    /* =====================================================
       HEADER PRINCIPAL: NAV HORIZONTAL COM LOGO CENTRAL
       ===================================================== */
    .site-header {
      background: var(--graphite);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
    }

    /* Nav esquerda */
    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
    }

    .nav-right {
      justify-content: flex-end;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--paper);
      border-radius: 8px;
      transition: var(--transition);
      white-space: nowrap;
      opacity: 0.88;
    }

    .nav-link:hover {
      background: rgba(255,255,255,0.06);
      opacity: 1;
      color: var(--yellow);
    }

    .nav-link.active {
      color: var(--yellow);
      opacity: 1;
      position: relative;
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 12px;
      right: 12px;
      height: 2px;
      background: var(--red);
      border-radius: 2px;
    }

    /* Nav icon */
    .nav-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.75;
    }

    /* Logo Central */
    .header-logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .header-logo img {
      height: 50px;
      width: auto;
      object-fit: contain;
    }

    /* Fallback se imagem falhar */
    .logo-fallback {
      display: none;
      align-items: center;
      gap: 4px;
      font-size: 1.5rem;
      font-weight: 900;
    }

    .logo-fallback .plus { color: var(--yellow); }
    .logo-fallback .b { color: var(--red); }

    /* Botão Ver Encarte */
    .btn-encarte {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--paper);
      color: var(--black);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: 8px;
      transition: var(--transition);
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .btn-encarte svg { color: var(--red); }

    .btn-encarte:hover {
      background: var(--yellow);
      color: var(--black);
      transform: translateY(-1px);
    }

    /* =====================================================
       HERO SLIDER
       ===================================================== */
    .hero-section {
      background: var(--graphite);
      padding: 12px 24px 16px;
    }

    .hero-swiper-wrap {
      max-width: 1280px;
      margin: 0 auto;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    .hero-swiper .swiper-slide {
      line-height: 0;
    }

    .hero-swiper .swiper-slide img {
      width: 100%;
      height: auto;
      object-fit: cover;
      display: block;
      line-height: 0;
    }

    /* Setas customizadas estilo Mais B */
    .hero-swiper .swiper-button-prev,
    .hero-swiper .swiper-button-next {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.18);
      color: var(--paper);
      transition: var(--transition);
    }

    .hero-swiper .swiper-button-prev:after,
    .hero-swiper .swiper-button-next:after {
      font-size: 1rem;
      font-weight: 800;
    }

    .hero-swiper .swiper-button-prev:hover,
    .hero-swiper .swiper-button-next:hover {
      background: var(--yellow);
      color: var(--black);
      border-color: transparent;
    }

    /* Pagination bullets */
    .hero-swiper .swiper-pagination {
      bottom: 14px;
    }

    .hero-swiper .swiper-pagination-bullet {
      width: 10px;
      height: 10px;
      background: rgba(255,255,255,0.5);
      opacity: 1;
      transition: var(--transition);
    }

    .hero-swiper .swiper-pagination-bullet-active {
      background: var(--yellow);
      width: 28px;
      border-radius: 5px;
    }

    /* =====================================================
       STATS BAR: 2015 | +10 MIL M² | 3 LOJAS | 5 MARCAS
       ===================================================== */
    .stats-bar {
      background: var(--paper);
      border-bottom: 1px solid #e5e7eb;
      padding: 20px 24px;
    }

    .stats-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 12px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      max-width: 280px;
    }

    .stat-divider {
      width: 1px;
      height: 48px;
      background: #e5e7eb;
      flex-shrink: 0;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--red);
    }

    .stat-text {}

    .stat-number {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--red);
      line-height: 1;
    }

    .stat-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #6b7280;
      margin-top: 2px;
    }

    /* =====================================================
       MOBILE
       ===================================================== */
    @media (max-width: 900px) {
      .topbar-center-social { position: static; transform: none; }
      .topbar-inner { position: relative; }
      .nav-left { display: none; }
      .nav-right .nav-link:not(.btn-encarte-wrap) { display: none; }
      .header-logo { position: static; transform: none; }
      .header-inner { justify-content: space-between; }
    }

    @media (max-width: 600px) {
      .hero-section { padding: 8px 12px 12px; }
      .stats-inner { flex-wrap: wrap; gap: 16px; }
      .stat-divider { display: none; }
      .stat-item { max-width: none; flex: 0 0 45%; }
    }
  </style>
</head>
<body>

  <!-- ====================================================
       TOPBAR: SOCIAL + LINKS INSTITUCIONAIS
       ==================================================== -->
  <div class="topbar">
    <div class="topbar-inner" style="position:relative;">

      <!-- Ícones de redes sociais centralizados (replicando o design) -->
      <div class="topbar-center-social">
        <!-- Instagram -->
        <a href="#" title="Instagram" aria-label="Instagram">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
        </a>
        <!-- Facebook -->
        <a href="#" title="Facebook" aria-label="Facebook">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </a>
        <!-- YouTube -->
        <a href="#" title="YouTube" aria-label="YouTube">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        </a>
      </div>

      <!-- Links direita -->
      <div class="topbar-links" style="margin-left:auto;">
        <a href="#unidades">Nossas Lojas</a>
        <a href="#sobre">Sobre Nós</a>
        <a href="#atendimento">Fale Conosco</a>
      </div>

    </div>
  </div>

  <!-- ====================================================
       HEADER PRINCIPAL: MENU + LOGO CENTRAL + ENCARTE
       ==================================================== -->
  <header class="site-header">
    <div class="header-inner">

      <!-- NAV ESQUERDA -->
      <nav class="nav-left" aria-label="Navegação principal esquerda">
        <a href="#" class="nav-link active">
          <!-- Home icon -->
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          Início
        </a>
        <a href="#sobre" class="nav-link">
          <!-- Team icon -->
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          Sobre o Grupo
        </a>
        <a href="#institucional" class="nav-link">
          <!-- Building icon -->
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
          Institucional
        </a>
      </nav>

      <!-- LOGO CENTRAL -->
      <a href="#" class="header-logo" aria-label="Supermercados Mais B — Home">
        <img
          src="./assets/Logos/logo-supermercados-maisb.webp"
          alt="Supermercados Mais B"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        />
        <!-- Fallback SVG logo -->
        <div class="logo-fallback">
          <span class="plus">+</span><span class="b">B</span>
        </div>
      </a>

      <!-- NAV DIREITA -->
      <nav class="nav-right" aria-label="Navegação principal direita">
        <a href="#unidades" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          Nossas Lojas
        </a>
        <a href="#clube" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 7H4V5H2v14h2v-2h16v2h2V5h-2v2zM4 15V9h16v6H4z"/></svg>
          Clube +Fidelidade
        </a>
        <a href="#encarte" class="btn-encarte">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          Ver Encarte Digital
        </a>
      </nav>

    </div>
  </header>

  <!-- ====================================================
       HERO BANNER SLIDER COM BANNERS REAIS DO PROJETO
       ==================================================== -->
  <section class="hero-section" id="home">
    <div class="hero-swiper-wrap">
      <div class="swiper hero-swiper">
        <div class="swiper-wrapper">

          <!-- SLIDE 1: Clube Fidelidade (o banner em destaque no design) -->
          <div class="swiper-slide">
            <img
              src="./assets/Page/S1 TOPO HERO/BANNER-TOPO (3).png"
              alt="Clube +Fidelidade — Cadastre-se pelo app e comece a aproveitar"
              loading="eager"
            />
          </div>

          <!-- SLIDE 2: Dia dos Pais -->
          <div class="swiper-slide">
            <img
              src="./assets/Page/S1 TOPO HERO/BANNER-TOPO (1).png"
              alt="Dia dos Pais — Tudo pra quem sempre fez o melhor por você"
              loading="lazy"
            />
          </div>

          <!-- SLIDE 3: Academia da Vida -->
          <div class="swiper-slide">
            <img
              src="./assets/Page/S1 TOPO HERO/BANNER-TOPO (2).png"
              alt="Por trás de grandes ideias, existe uma grande marca"
              loading="lazy"
            />
          </div>

        </div>

        <!-- Controles -->
        <div class="swiper-button-prev" aria-label="Banner anterior"></div>
        <div class="swiper-button-next" aria-label="Próximo banner"></div>
        <div class="swiper-pagination"></div>
      </div>
    </div>
  </section>

  <!-- ====================================================
       STATS BAR: NÚMEROS DO GRUPO MAIS B
       ==================================================== -->
  <div class="stats-bar" id="numeros">
    <div class="stats-inner">

      <!-- 2015 -->
      <div class="stat-item">
        <div class="stat-icon">
          <!-- Calendar icon -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="stat-text">
          <div class="stat-number">2015</div>
          <div class="stat-label">Início da nossa história.</div>
        </div>
      </div>

      <div class="stat-divider"></div>

      <!-- +10 MIL M² -->
      <div class="stat-item">
        <div class="stat-icon">
          <!-- Building/store icon -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="stat-text">
          <div class="stat-number">+10 MIL M²</div>
          <div class="stat-label">De área operacional.</div>
        </div>
      </div>

      <div class="stat-divider"></div>

      <!-- 3 LOJAS -->
      <div class="stat-item">
        <div class="stat-icon">
          <!-- Store icon -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        </div>
        <div class="stat-text">
          <div class="stat-number">3 <span style="font-size:1.1rem;letter-spacing:1px;font-weight:800;">LOJAS</span></div>
          <div class="stat-label">Bem localizadas em Belém.</div>
        </div>
      </div>

      <div class="stat-divider"></div>

      <!-- 5 MARCAS -->
      <div class="stat-item">
        <div class="stat-icon">
          <!-- Award/medal icon -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
        </div>
        <div class="stat-text">
          <div class="stat-number">5 <span style="font-size:1.1rem;letter-spacing:1px;font-weight:800;">MARCAS</span></div>
          <div class="stat-label">Marcas de confiança.</div>
        </div>
      </div>

    </div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    new Swiper('.hero-swiper', {
      loop: true,
      autoplay: {
        delay: 5000,
        disableOnInteraction: false,
        pauseOnMouseEnter: true,
      },
      speed: 700,
      effect: 'slide',
      navigation: {
        nextEl: '.hero-swiper .swiper-button-next',
        prevEl: '.hero-swiper .swiper-button-prev',
      },
      pagination: {
        el: '.hero-swiper .swiper-pagination',
        clickable: true,
        dynamicBullets: false,
      },
      keyboard: { enabled: true },
      a11y: { enabled: true },
    });
  </script>
</body>
</html>
