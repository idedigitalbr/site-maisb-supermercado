name: site-maisb-supermercado
version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site-maisb-supermercado-web
    restart: always
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.site-maisb-supermercado-live.priority=1000"
      - "traefik.http.routers.site-maisb-supermercado-live.service=site-maisb-supermercado-live-svc"
      - "traefik.http.routers.site-maisb-supermercado-live.rule=Host(`maisbsupermercados.suporteide.digital`) || Host(`maisbsupermercados.com.br`)"
      - "traefik.http.routers.site-maisb-supermercado-live.entrypoints=websecure"
      - "traefik.http.routers.site-maisb-supermercado-live.tls=true"
      - "traefik.http.routers.site-maisb-supermercado-live.tls.certresolver=letsencrypt"
      - "traefik.http.services.site-maisb-supermercado-live-svc.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
