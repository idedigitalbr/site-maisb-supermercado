name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-site-maisb-supermercado
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH and Deploy to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          SCAN_FILE="$(mktemp)"
          AGENT_STARTED=0
          trap 'rm -f "$SCAN_FILE"; if [ "$AGENT_STARTED" -eq 1 ]; then ssh-agent -k >/dev/null; fi' EXIT
          ssh-keyscan -p "$VPS_PORT" -T 10 -t rsa,ecdsa,ed25519 "$VPS_HOST" > "$SCAN_FILE" 2>/dev/null
          if [ ! -s "$SCAN_FILE" ]; then
            echo "Não foi possível obter a chave SSH do VPS." >&2
            exit 1
          fi

          if ! ssh-keygen -lf "$SCAN_FILE" -E sha256 | awk '{print $2}' | grep -Fxq "$VPS_FINGERPRINT"; then
            echo "Fingerprint SSH do VPS não confere com VPS_SSH_FINGERPRINT." >&2
            exit 1
          fi

          cat "$SCAN_FILE" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          
          eval "$(ssh-agent -s)"
          AGENT_STARTED=1
          if ! printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -; then
            echo "VPS_SSH_KEY inválida ou em formato não suportado." >&2
            exit 1
          fi
          
          ssh -A -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER"@"$VPS_HOST" <<'REMOTE'
          set -e
          
          PROJECT_DIR="/opt/site-maisb-supermercado/app"
          
          RESOLVED_DIR=$(realpath "$PROJECT_DIR")
          if [ "$RESOLVED_DIR" = "/" ] || [ "$RESOLVED_DIR" = "/opt" ] || [ "$RESOLVED_DIR" = "/var" ] || [ "$RESOLVED_DIR" = "/home" ] || [ "$RESOLVED_DIR" = "/root" ] || [ -z "$RESOLVED_DIR" ]; then
            echo "ABORTAR: Diretório do projeto é inválido ou perigoso: $RESOLVED_DIR" >&2
            exit 99
          fi
          
          cd "$RESOLVED_DIR"
          
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          
          docker compose up -d --build --remove-orphans
          
          REMOTE

      - name: Diagnosticar entrega pública após o deploy
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          for host in maisbsupermercados.com.br www.maisbsupermercados.com.br maisbsupermercados.suporteide.digital; do
            echo "===== PUBLIC CHECK: $host ====="
            getent ahostsv4 "$host" | awk 'NR <= 3 {print "DNS: " $1}' || true
            body="$(mktemp)"
            headers="$(mktemp)"
            url="https://$host/?_ci_check=${GITHUB_SHA}"
            curl -LsS --max-time 18 -H "Cache-Control: no-cache" -H "Pragma: no-cache" -D "$headers" -o "$body" "$url"
            rc=$?
            echo "curl_exit=$rc"
            awk 'BEGIN{IGNORECASE=1} /^HTTP\/|^server:|^cf-cache-status:|^location:|^age:|^content-type:/ {print}' "$headers" | tail -18
            echo "received_bytes=$(wc -c < "$body")"
            if grep -Fq 'fachada-maisb-home-sobre-2026-10-21.jpg' "$body"; then
              echo "RESULT: NEW_PHOTO_REFERENCE_PRESENT"
            elif grep -Fq 'unid-plaza-foto-de-fachada-vila-plaza.webp' "$body"; then
              echo "RESULT: OLD_PHOTO_REFERENCE_PRESENT"
            else
              echo "RESULT: NEITHER_PHOTO_REFERENCE_PRESENT"
            fi
            asset_url="https://$host/assets/Fotografias/01_Fachadas/fachada-maisb-home-sobre-2026-10-21.jpg?_ci_check=${GITHUB_SHA}"
            asset_status="$(curl -LsS --max-time 18 -o /dev/null -w '%{http_code} %{size_download} %{url_effective}' "$asset_url" || true)"
            echo "NEW_ASSET: $asset_status"
            rm -f "$body" "$headers"
          done
